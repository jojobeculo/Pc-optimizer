name: windows-ci
# Builds and tests FrameCore on a disposable GitHub-hosted Windows runner:
# unit tests, real-Windows integration tests (apply/restore round trip), automated UI tour with
# screenshots, installer build, silent install / launch / uninstall. Nothing here runs on a user's PC.
on:
  push:
    branches: [ "claude/**", "main" ]
  workflow_dispatch:

jobs:
  installer:
    # The installer is built on Linux exactly like build/build.sh does locally (native x64 NSIS stub).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build installer
        run: build/build.sh --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts
          retention-days: 7

  windows:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Screen resolution 1920x1080
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution unavailable: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          "Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Unit tests
        run: dotnet test tests/FrameCore.Tests/FrameCore.Tests.csproj -c Release --nologo --logger "console;verbosity=normal"

      - name: Integration tests (real Windows, disposable VM only)
        shell: pwsh
        env:
          FRAMECORE_DISPOSABLE_VM: '1'
        run: |
          $env:FRAMECORE_TEST_OUTPUT = "$pwd\out\integration"
          dotnet test tests/FrameCore.WindowsIntegrationTests/FrameCore.WindowsIntegrationTests.csproj -c Release --nologo --logger "console;verbosity=detailed"

      - name: Publish
        if: success() || failure()
        run: dotnet publish src/FrameCore.UI/FrameCore.UI.csproj -c Release -r win-x64 --self-contained true -o publish/FrameCore --nologo

      - name: Automated UI tour (every page + real user flows on this disposable VM)
        if: success() || failure()
        shell: pwsh
        env:
          FRAMECORE_DISPOSABLE_VM: '1'
        run: |
          $dir = "$pwd\out\tour"
          $p = Start-Process -FilePath publish\FrameCore\FrameCore.exe -ArgumentList '--ui-tour', $dir -PassThru
          if (-not $p.WaitForExit(1200000)) { "Tour timed out"; Stop-Process -Id $p.Id -Force }
          "Exit code: $($p.ExitCode)"
          Get-Content "$dir\report.json" -ErrorAction SilentlyContinue | Select-Object -First 400

      - name: UI tour as a standard user (no administrator rights, like a normal session)
        if: success() || failure()
        shell: pwsh
        run: |
          $dir = "$pwd\out\user-tour"
          $exe = "$pwd\publish\FrameCore\FrameCore.exe"
          # Basic User trust level: same account, Administrators group removed from the token.
          Start-Process runas.exe -ArgumentList "/trustlevel:0x20000 `"$exe --ui-tour $dir`""
          Start-Sleep -Seconds 5
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Process FrameCore -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          Get-Process FrameCore -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$dir\report.json" -ErrorAction SilentlyContinue | Select-Object -First 120

      - uses: actions/download-artifact@v4
        if: success() || failure()
        with:
          name: installer
          path: out/installer

      - name: Silent install, launch, uninstall
        if: success() || failure()
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$pwd\out\installer\FrameCore-Setup-*-x64.exe" | Select-Object -First 1).FullName
          $log = "$pwd\out\installer\install-test.txt"
          $p = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
          "install exit: $($p.ExitCode)" | Tee-Object $log
          $dir = "$env:ProgramFiles\FrameCore"
          "exe present: $(Test-Path "$dir\FrameCore.exe")" | Tee-Object $log -Append
          "catalog present: $(Test-Path "$dir\catalog\tweaks")" | Tee-Object $log -Append
          "start menu shortcut: $(Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\FrameCore.lnk")" | Tee-Object $log -Append
          $u = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FrameCore' -ErrorAction SilentlyContinue
          "uninstall entry: $($u.DisplayName) $($u.DisplayVersion) size=$($u.EstimatedSize)KB" | Tee-Object $log -Append
          $a = Start-Process "$dir\FrameCore.exe" -ArgumentList '--ui-tour', "$pwd\out\installed-tour" -PassThru
          if (-not $a.WaitForExit(420000)) { Stop-Process -Id $a.Id -Force; "installed app tour timed out" | Tee-Object $log -Append }
          "installed app tour exit: $($a.ExitCode), report: $(Test-Path "$pwd\out\installed-tour\report.json")" | Tee-Object $log -Append
          $un = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -PassThru -Wait
          Start-Sleep -Seconds 5
          "uninstall exit: $($un.ExitCode)" | Tee-Object $log -Append
          "folder removed: $(-not (Test-Path $dir))" | Tee-Object $log -Append
          "uninstall entry removed: $(-not (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FrameCore'))" | Tee-Object $log -Append
          "user data kept: $(Test-Path "$env:LOCALAPPDATA\FrameCore")" | Tee-Object $log -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-output
          path: out
          retention-days: 7
